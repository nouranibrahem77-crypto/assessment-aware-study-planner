[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "assessment-aware-study-planner"
version = "0.1.0"
description = "An Intelligent Systems university assignment study planner."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
make-oulad-data = "study_planner.data.oulad:main"
make-fff-features = "study_planner.data.feature_engineering.pipeline:main"
train-fff-nn = "study_planner.nn.training:main"
train-fff-nn-validation = "study_planner.nn.training:validation_only_main"
train-previous-marks-nn = "study_planner.nn.previous_marks_training:main"

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.2",
]
ml = [
    "numpy==2.4.6",
    "pandas==3.1.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "torch==2.15.0+cpu",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

